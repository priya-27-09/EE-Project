{% extends "base.html" %}

{% block title %}Citizen Registration — AI Civic Guardian{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
  <div class="card">
    <h1 class="card-title" data-i18n="citizen_register">Citizen Registration</h1>
    <p class="card-subtitle" data-i18n="citizen_register_sub">Create your citizen account to lodge and track civic complaints.</p>

    <div id="register-alert" style="display: none;"></div>

    <form id="form-register" novalidate>
      <div class="form-group">
        <label for="reg-name" class="form-label" data-i18n="full_name">Full Name *</label>
        <input type="text" id="reg-name" class="form-input" required placeholder="e.g. Priya Sharma" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label" data-i18n="email_address">Email Address *</label>
        <input type="email" id="reg-email" class="form-input" required placeholder="citizen@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="reg-language" class="form-label" data-i18n="preferred_comm_lang">Preferred Communication Language</label>
        <select id="reg-language" class="form-select">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
          <option value="hi">हिन्दी</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label" data-i18n="password">Password *</label>
        <input type="password" id="reg-password" class="form-input" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="reg-confirm-password" class="form-label" data-i18n="confirm_password">Confirm Password *</label>
        <input type="password" id="reg-confirm-password" class="form-input" required minlength="6" placeholder="Re-enter your password" autocomplete="new-password">
      </div>

      <button type="submit" id="btn-submit-register" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;" data-i18n="register_btn">
        Register as Citizen
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      <span data-i18n="already_have_account">Already have an account?</span> <a href="/login" style="color: var(--primary-blue); font-weight: 600;" data-i18n="login_here">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("register-alert");
    alertBox.style.display = "none";

    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const language = document.getElementById("reg-language").value;
    const password = document.getElementById("reg-password").value;
    const confirmPassword = document.getElementById("reg-confirm-password").value;
    const submitBtn = document.getElementById("btn-submit-register");

    if (!name || !email || !password) {
      alertBox.className = "alert alert-danger";
      alertBox.textContent = "Please fill in all required fields.";
      alertBox.style.display = "block";
      return;
    }

    if (password !== confirmPassword) {
      alertBox.className = "alert alert-danger";
      alertBox.textContent = "Passwords do not match. Please re-enter.";
      alertBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Registering...";

    try {
      await ApiClient.register(name, email, password, language);
      alertBox.className = "alert alert-success";
      alertBox.textContent = "Registration successful! Redirecting to login...";
      alertBox.style.display = "block";

      setTimeout(() => {
        window.location.href = "/login?registered=1";
      }, 1200);
    } catch (err) {
      alertBox.className = "alert alert-danger";
      alertBox.textContent = err.message;
      alertBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Register as Citizen";
    }
  });
</script>
{% endblock %}
